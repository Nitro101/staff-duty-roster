<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Duty Roster</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background:#f4f6f8; color:#222; padding:16px; }
  .app { max-width:600px; margin:0 auto; }
  header { background:#1a73e8; color:#fff; padding:16px; border-radius:12px; margin-bottom:16px; }
  header h1 { font-size:20px; }
  header p { font-size:13px; opacity:.9; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; padding:12px; border:none; border-radius:10px; background:#fff; font-size:14px; cursor:pointer; }
  .tabs button.active { background:#1a73e8; color:#fff; }
  .card { background:#fff; border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .card h2 { font-size:16px; margin-bottom:12px; }
  input, select { width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; font-size:14px; margin-bottom:10px; }
  button.primary { width:100%; padding:14px; background:#1a73e8; color:#fff; border:none; border-radius:10px; font-size:15px; cursor:pointer; margin-bottom:10px; }
  button.secondary { width:100%; padding:12px; background:#e8f0fe; color:#1a73e8; border:none; border-radius:10px; font-size:14px; cursor:pointer; margin-bottom:10px; }
  button.danger { width:100%; padding:12px; background:#fce8e6; color:#c5221f; border:none; border-radius:10px; font-size:14px; cursor:pointer; }
  .staff-item { display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee; }
  .staff-item:last-child { border-bottom:none; }
  .staff-item button { background:none; border:none; color:#c5221f; font-size:18px; cursor:pointer; }
  .day { margin-bottom:12px; }
  .day h3 { font-size:14px; margin-bottom:6px; }
  .day .btns { display:flex; gap:6px; }
  .day .btns button { flex:1; padding:8px; border:1px solid #ccc; border-radius:8px; background:#fff; font-size:12px; cursor:pointer; }
  .day .btns button.od { background:#fce8e6; color:#c5221f; border-color:#c5221f; }
  .day .btns button.off { background:#e6f4ea; color:#137333; border-color:#137333; }
  .status { font-size:13px; padding:10px; border-radius:8px; margin-bottom:10px; }
  .status.ok { background:#e6f4ea; color:#137333; }
  .status.warn { background:#fef7e0; color:#b06000; }
  .status.err { background:#fce8e6; color:#c5221f; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Staff Duty Roster</h1>
    <p>Manage OD and OFF days. Syncs to your Google Sheet.</p>
  </header>

  <div class="tabs">
    <button id="tab-roster" class="active" onclick="showTab('roster')">Roster</button>
    <button id="tab-staff" onclick="showTab('staff')">Staff</button>
    <button id="tab-settings" onclick="showTab('settings')">Settings</button>
  </div>

  <!-- ROSTER -->
  <div id="view-roster">
    <div class="card">
      <h2>This Week</h2>
      <input type="date" id="week-start" onchange="renderRoster()">
      <div id="roster-days"></div>
    </div>
  </div>

  <!-- STAFF -->
  <div id="view-staff" class="hidden">
    <div class="card">
      <h2>Staff Members</h2>
      <input id="new-staff" placeholder="Staff name">
      <button class="primary" onclick="addStaff()">Add Staff</button>
      <div id="staff-list"></div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div id="view-settings" class="hidden">
    <div class="card">
      <h2>Google Sheets</h2>
      <div id="sync-status" class="status warn">Not connected</div>
      <button class="primary" onclick="connectGoogle()">Connect Google account</button>
      <button class="secondary" onclick="createSheet()">Create Google Sheet</button>
      <input id="sheet-id" placeholder="Paste Google Sheet ID here">
      <button class="secondary" onclick="saveSheetId()">Save Sheet ID</button>
      <button class="secondary" onclick="syncNow()">Sync now</button>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const GOOGLE_CLIENT_ID = "406015748349-j23ai39p6cij0t42fgiet11os4nnsoco.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/spreadsheets";

let accessToken = null;
let tokenClient = null;
let staff = JSON.parse(localStorage.getItem("sdr_staff") || "[]");
let roster = JSON.parse(localStorage.getItem("sdr_roster") || "{}");
let sheetId = localStorage.getItem("sdr_sheetId") || "";

function showTab(tab) {
  ["roster","staff","settings"].forEach(t => {
    document.getElementById("view-" + t).classList.add("hidden");
    document.getElementById("tab-" + t).classList.remove("active");
  });
  document.getElementById("view-" + tab).classList.remove("hidden");
  document.getElementById("tab-" + tab).classList.add("active");
  if (tab === "roster") renderRoster();
  if (tab === "staff") renderStaff();
  if (tab === "settings") document.getElementById("sheet-id").value = sheetId;
}

function save() {
  localStorage.setItem("sdr_staff", JSON.stringify(staff));
  localStorage.setItem("sdr_roster", JSON.stringify(roster));
}

function addStaff() {
  const name = document.getElementById("new-staff").value.trim();
  if (!name) return;
  staff.push({ id: Date.now(), name });
  save();
  document.getElementById("new-staff").value = "";
  renderStaff();
}

function removeStaff(id) {
  staff = staff.filter(s => s.id !== id);
  save();
  renderStaff();
}

function renderStaff() {
  const el = document.getElementById("staff-list");
  el.innerHTML = staff.map(s =>
    `<div class="staff-item"><span>${s.name}</span><button onclick="removeStaff(${s.id})">✕</button></div>`
  ).join("") || "<p>No staff added yet.</p>";
}

function getWeekStart() {
  const v = document.getElementById("week-start").value;
  if (v) return new Date(v);
  const d = new Date();
  const day = d.getDay();
  d.setDate(d.getDate() - ((day + 6) % 7));
  return d;
}

function renderRoster() {
  const start = getWeekStart();
  const el = document.getElementById("roster-days");
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const key = d.toISOString().slice(0,10);
    html += `<div class="day"><h3>${d.toDateString()}</h3><div class="btns">`;
    staff.forEach(s => {
      const val = (roster[key] || {})[s.id] || "";
      html += `<button class="${val === "OD" ? "od" : val === "OFF" ? "off" : ""}"
        onclick="setStatus('${key}',${s.id},'${val === "OD" ? "OFF" : val === "OFF" ? "" : "OD"}')">
        ${s.name}: ${val || "—"}</button>`;
    });
    html += `</div></div>`;
  }
  el.innerHTML = html || "<p>Add staff members first.</p>";
}

function setStatus(date, staffId, status) {
  if (!roster[date]) roster[date] = {};
  if (status) roster[date][staffId] = status;
  else delete roster[date][staffId];
  save();
  renderRoster();
}

function setStatusMsg(text, cls) {
  const el = document.getElementById("sync-status");
  el.textContent = text;
  el.className = "status " + cls;
}

function connectGoogle() {
  if (!tokenClient) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: SCOPE,
      callback: (resp) => {
        if (resp.access_token) {
          accessToken = resp.access_token;
          setStatusMsg("Connected to Google", "ok");
        }
      }
    });
  }
  tokenClient.requestAccessToken();
}

async function api(url, options = {}) {
  if (!accessToken) throw new Error("Not connected");
  const res = await fetch(url, {
    ...options,
    headers: { Authorization: "Bearer " + accessToken, "Content-Type": "application/json", ...(options.headers || {}) }
  });
  if (res.status === 401) {
    accessToken = null;
    throw new Error("Session expired, reconnect");
  }
  if (!res.ok) throw new Error("API error " + res.status);
  return res.json();
}

async function createSheet() {
  try {
    setStatusMsg("Creating sheet…", "warn");
    const data = await api("https://sheets.googleapis.com/v4/spreadsheets", {
      method: "POST",
      body: JSON.stringify({ properties: { title: "Staff Duty Roster" } })
    });
    sheetId = data.spreadsheetId;
    localStorage.setItem("sdr_sheetId", sheetId);
    document.getElementById("sheet-id").value = sheetId;
    setStatusMsg("Sheet created and saved", "ok");
  } catch (e) { setStatusMsg(e.message, "err"); }
}

function saveSheetId() {
  sheetId = document.getElementById("sheet-id").value.trim();
  localStorage.setItem("sdr_sheetId", sheetId);
  setStatusMsg("Sheet ID saved", "ok");
}

async function syncNow() {
  if (!sheetId) { setStatusMsg("No Sheet ID set", "err"); return; }
  try {
    setStatusMsg("Syncing…", "warn");
    await api(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:Z5000:clear`, { method: "POST" });
    const rows = [["Date", "Staff", "Status"]];
    Object.keys(roster).sort().forEach(date => {
      staff.forEach(s => {
        const st = roster[date][s.id];
        if (st) rows.push([date, s.name, st]);
      });
    });
    await api(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1?valueInputOption=RAW`, {
      method: "PUT",
      body: JSON.stringify({ values: rows })
    });
    setStatusMsg("Synced to Google Sheets", "ok");
  } catch (e) { setStatusMsg(e.message, "err"); }
}

document.getElementById("week-start").value = getWeekStart().toISOString().slice(0,10);
renderRoster();
</script>
</body>
</html>
