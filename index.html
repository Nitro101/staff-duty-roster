<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Duty Roster</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565c0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #f2f4f7; color: #222; }
  header { background: #1565c0; color: white; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .company-header { display: flex; align-items: center; gap: 10px; }
  #headerLogo { height: 40px; width: auto; border-radius: 6px; background: white; padding: 3px; }
  header h1 { margin: 0; font-size: 20px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button, input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { background: #1565c0; color: white; border: none; cursor: pointer; }
  button.secondary { background: #546e7a; }
  main { padding: 12px; }
  .main-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .main-tab { padding: 10px 18px; border-radius: 8px 8px 0 0; background: #cfd8dc; border: none; cursor: pointer; color: #333; }
  .main-tab.active { background: #1565c0; color: white; font-weight: bold; }
  .screen { display: none; }
  .screen.active { display: block; }
  .card { background: white; border-radius: 10px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.12); margin-bottom: 16px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .form-row input, .form-row select { flex: 1; min-width: 140px; }
  .staff-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .staff-chip { background: #e3f2fd; border: 1px solid #90caf9; padding: 6px 10px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
  .staff-chip button { background: #b71c1c; padding: 2px 7px; font-size: 12px; }
  .roster-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .roster-tab { padding: 10px 18px; border-radius: 8px 8px 0 0; background: #cfd8dc; border: none; cursor: pointer; color: #333; }
  .roster-tab.active { background: #1565c0; color: white; font-weight: bold; }
  .roster-wrap { overflow-x: auto; background: white; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  table { border-collapse: collapse; width: max-content; min-width: 100%; }
  th, td { border: 1px solid #cfd8dc; padding: 6px; text-align: center; font-size: 12px; white-space: nowrap; }
  .staff-name { text-align: left; min-width: 150px; font-weight: bold; background: #f5f5f5; }
  .weekday-row th { background: #eceff1; font-weight: normal; }
  .date-row th { background: #eceff1; font-weight: bold; }
  .weekday-cell { background: white; }
  .weekend-letter { color: #ff5722 !important; font-weight: bold; }
  .od { background: #2e7d32; color: white; font-weight: bold; cursor: pointer; }
  .of { background: #eeeeee; color: #555; cursor: pointer; }
  .special-cell { background: #d6d6d6 !important; }
  .special-cell.od { background: #2e7d32 !important; color: white; }
  .special-cell.of { background: #d6d6d6 !important; color: #555; }
  .empty { padding: 30px; text-align: center; color: #666; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  #logoPreview { margin-top: 10px; }
  #logoPreview img { max-height: 80px; max-width: 220px; border: 1px solid #ccc; border-radius: 8px; background: white; padding: 5px; }
  .google-status { padding: 10px; border-radius: 8px; background: #eceff1; margin-bottom: 10px; font-weight: bold; }
  .google-status.connected { background: #e8f5e9; color: #2e7d32; }
  .google-status.error { background: #ffebee; color: #b71c1c; }
  .small-text { font-size: 12px; color: #666; margin: 0; }
  .print-header { display: none; }

  @media (max-width: 700px), (pointer: coarse) {
    .roster-tabs { gap: 12px; margin-bottom: 16px; }
    .roster-tab { padding: 20px 40px; font-size: 22px; min-width: 150px; min-height: 64px; border-radius: 12px; }
    .roster-tab.active { font-size: 22px; }
    th, td { padding: 12px 8px; font-size: 14px; }
    .staff-name { min-width: 170px; }
    .od, .of { min-width: 52px; min-height: 52px; }
  }

  @media print {
    header, .main-tabs, .roster-tabs, .card, .actions, .no-print { display: none !important; }
    body { background: white; }
    main { padding: 0; }
    .print-header { display: block; margin-bottom: 10px; }
    .print-top-row { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 8px; }
    .print-bottom-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-bottom: 8px; }
    .print-company { display: flex; align-items: center; gap: 8px; }
    .print-company img { max-height: 45px; max-width: 140px; }
    .print-company-name { font-size: 14px; font-weight: bold; }
    .print-section { font-size: 16px; font-weight: bold; }
    .print-prepared-by { font-size: 13px; font-weight: bold; }
    .roster-wrap { box-shadow: none; border-radius: 0; }
    th, td { font-size: 9px; padding: 3px; }
    .staff-name { min-width: 110px; }
    @page { size: A4 landscape; margin: 8mm; }
  }
</style>
</head>

<body>

<header>
  <div class="company-header">
    <img id="headerLogo" src="" alt="Company logo" style="display:none">
    <h1 id="headerCompanyName">Staff Duty Roster</h1>
  </div>

  <div class="controls">
    <select id="month"></select>
    <select id="year"></select>
    <button class="secondary" onclick="window.print()">Print</button>
    <button class="secondary" onclick="exportPDF()">Export</button>
  </div>
</header>

<main>
  <div class="print-header">
    <div class="print-top-row" id="printMonthTitle"></div>

    <div class="print-bottom-row">
      <div class="print-company">
        <img id="printLogo" src="" alt="" style="display:none">
        <div class="print-company-name" id="printCompanyName"></div>
      </div>

      <div class="print-section" id="printSection"></div>

      <div class="print-prepared-by" id="printPreparedBy"></div>
    </div>
  </div>

  <div class="main-tabs no-print">
    <button class="main-tab active" id="rosterMainTab" onclick="showScreen('roster')">Roster</button>
    <button class="main-tab" id="settingsMainTab" onclick="showScreen('settings')">Settings</button>
  </div>

  <div id="rosterScreen" class="screen active">
    <div class="roster-tabs no-print">
      <button class="roster-tab active" id="dayTab" onclick="setSection('DAY')">Day</button>
      <button class="roster-tab" id="nightTab" onclick="setSection('NIGHT')">Night</button>
    </div>

    <div class="roster-wrap">
      <div id="roster"></div>
    </div>

    <div class="actions no-print">
      <button class="secondary" onclick="undo()">Undo</button>
      <button class="secondary" onclick="redo()">Redo</button>
      <button class="secondary" onclick="clearMonth()">Clear this month</button>
    </div>
  </div>

  <div id="settingsScreen" class="screen">
    <div class="card">
      <h3>Company settings</h3>

      <div class="form-row">
        <input id="companyName" placeholder="Company name" oninput="saveCompany()">
        <input id="preparedByName" placeholder="Off duties by: name" oninput="savePreparedBy()">
      </div>

      <div class="form-row">
        <input type="file" id="companyLogo" accept="image/*" onchange="saveLogo(this)">
        <button class="secondary" onclick="removeLogo()">Remove logo</button>
      </div>

      <div id="logoPreview"></div>
    </div>

    <div class="card">
      <h3>Add staff</h3>

      <div class="form-row">
        <input id="staffName" placeholder="Staff name">
        <select id="staffSection">
          <option value="DAY">Day</option>
          <option value="NIGHT">Night</option>
        </select>
        <button onclick="addStaff()">Save staff</button>
      </div>

      <h4>Day staff</h4>
      <div class="staff-list" id="dayStaffList"></div>

      <h4>Night staff</h4>
      <div class="staff-list" id="nightStaffList"></div>
    </div>

    <div class="card">
      <h3>Google Sheets</h3>

      <div id="googleStatus" class="google-status">Not connected</div>

      <div class="form-row">
        <button onclick="connectGoogle()">Connect Google account</button>
        <button onclick="createGoogleSheet()">Create Google Sheet</button>
        <button onclick="syncNow()">Sync now</button>
        <button class="secondary" onclick="disconnectGoogle()">Disconnect</button>
      </div>

      <div class="form-row">
        <input id="spreadsheetId" placeholder="Paste Google Sheet ID" oninput="saveSpreadsheetId()">
      </div>

      <p class="small-text">Google Sheets is optional. Use the same Google Sheet on every phone and PC to keep the roster the same.</p>
    </div>
  </div>
</main>

<script>
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const FIXED_HOLIDAYS = ["01-01","03-21","04-27","05-01","06-16","08-09","09-24","12-16","12-25","12-26"];

const GOOGLE_CLIENT_ID = "406015748349-j23ai39p6cij0t42fgiet11os4nnsoco.apps.googleusercontent.com";

let state = {
  companyName: "",
  companyLogo: "",
  preparedByName: "",
  staff: [],
  roster: {},
  section: "DAY"
};

let undoHistory = [];
let redoHistory = [];

let googleAccessToken = "";
let googleTokenExpiry = 0;
let syncTimer = null;

let cloudSettings = {
  spreadsheetId: ""
};

const monthSelect = document.getElementById("month");
const yearSelect = document.getElementById("year");

MONTHS.forEach(function(monthName, index) {
  const option = document.createElement("option");
  option.value = index;
  option.textContent = monthName;
  monthSelect.appendChild(option);
});

const currentYear = new Date().getFullYear();

for (let year = currentYear - 2; year <= 2070; year++) {
  const option = document.createElement("option");
  option.value = year;
  option.textContent = year;
  yearSelect.appendChild(option);
}

monthSelect.value = new Date().getMonth();
yearSelect.value = currentYear;

function loadData() {
  const saved = localStorage.getItem("staffDutyRoster");

  if (saved) {
    state = JSON.parse(saved);
  }

  const cloud = localStorage.getItem("staffDutyRosterCloud");

  if (cloud) {
    cloudSettings = JSON.parse(cloud);
  }

  cloudSettings.spreadsheetId = cloudSettings.spreadsheetId || "";

  state.companyName = state.companyName || "";
  state.companyLogo = state.companyLogo || "";
  state.preparedByName = state.preparedByName || "";
  state.staff = state.staff || [];
  state.roster = state.roster || {};
  state.section = state.section || "DAY";

  document.getElementById("spreadsheetId").value = cloudSettings.spreadsheetId;

  updateGoogleStatus();
}

function saveData() {
  localStorage.setItem("staffDutyRoster", JSON.stringify(state));

  if (cloudSettings.spreadsheetId && googleAccessToken) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, 1500);
  }
}

function saveCloudSettings() {
  localStorage.setItem("staffDutyRosterCloud", JSON.stringify(cloudSettings));
}

function saveHistory() {
  undoHistory.push(JSON.stringify(state));
  redoHistory = [];

  if (undoHistory.length > 50) {
    undoHistory.shift();
  }
}

function undo() {
  if (undoHistory.length === 0) {
    alert("There is nothing to undo.");
    return;
  }

  redoHistory.push(JSON.stringify(state));

  const previousState = undoHistory.pop();

  state = JSON.parse(previousState);

  state.companyName = state.companyName || "";
  state.companyLogo = state.companyLogo || "";
  state.preparedByName = state.preparedByName || "";
  state.staff = state.staff || [];
  state.roster = state.roster || {};
  state.section = state.section || "DAY";

  saveData();
  updateCompanyHeader();
  showLogoPreview();
  renderStaffLists();
  render();
}

function redo() {
  if (redoHistory.length === 0) {
    alert("There is nothing to redo.");
    return;
  }

  undoHistory.push(JSON.stringify(state));

  const nextState = redoHistory.pop();

  state = JSON.parse(nextState);

  state.companyName = state.companyName || "";
  state.companyLogo = state.companyLogo || "";
  state.preparedByName = state.preparedByName || "";
  state.staff = state.staff || [];
  state.roster = state.roster || {};
  state.section = state.section || "DAY";

  saveData();
  updateCompanyHeader();
  showLogoPreview();
  renderStaffLists();
  render();
}

function showScreen(screenName) {
  const rosterScreen = document.getElementById("rosterScreen");
  const settingsScreen = document.getElementById("settingsScreen");
  const rosterTab = document.getElementById("rosterMainTab");
  const settingsTab = document.getElementById("settingsMainTab");

  if (screenName === "roster") {
    rosterScreen.classList.add("active");
    settingsScreen.classList.remove("active");
    rosterTab.classList.add("active");
    settingsTab.classList.remove("active");
  } else {
    settingsScreen.classList.add("active");
    rosterScreen.classList.remove("active");
    settingsTab.classList.add("active");
    rosterTab.classList.remove("active");
  }

  renderStaffLists();
}

function saveCompany() {
  saveHistory();

  state.companyName = document.getElementById("companyName").value.trim();

  saveData();
  updateCompanyHeader();
  updatePrintHeader();
}

function savePreparedBy() {
  saveHistory();

  state.preparedByName = document.getElementById("preparedByName").value.trim();

  saveData();
  updatePrintHeader();
}

function saveLogo(input) {
  const file = input.files[0];

  if (!file) {
    return;
  }

  saveHistory();

  const reader = new FileReader();

  reader.onload = function(event) {
    state.companyLogo = event.target.result;
    saveData();
    updateCompanyHeader();
    showLogoPreview();
    updatePrintHeader();
  };

  reader.readAsDataURL(file);
}

function removeLogo() {
  saveHistory();

  state.companyLogo = "";
  saveData();
  updateCompanyHeader();
  showLogoPreview();
  updatePrintHeader();
  document.getElementById("companyLogo").value = "";
}

function updateCompanyHeader() {
  const name = state.companyName || "Staff Duty Roster";
  const logo = state.companyLogo;

  document.getElementById("headerCompanyName").textContent = name;
  document.getElementById("companyName").value = state.companyName || "";

  const logoElement = document.getElementById("headerLogo");

  if (logo) {
    logoElement.src = logo;
    logoElement.style.display = "block";
  } else {
    logoElement.src = "";
    logoElement.style.display = "none";
  }
}

function showLogoPreview() {
  const preview = document.getElementById("logoPreview");
  const logo = state.companyLogo;

  if (logo) {
    preview.innerHTML = '<img src="' + logo + '" alt="Company logo">';
  } else {
    preview.innerHTML = "";
  }
}

function updatePrintHeader() {
  const year = parseInt(yearSelect.value);
  const month = parseInt(monthSelect.value);

  document.getElementById("printMonthTitle").textContent = MONTHS[month] + " " + year + " — Off Duties";
  document.getElementById("printCompanyName").textContent = state.companyName || "";
  document.getElementById("printSection").textContent = state.section === "DAY" ? "DAY" : "NIGHT";
  document.getElementById("printPreparedBy").textContent = "Off duties by " + (state.preparedByName || "");

  const printLogo = document.getElementById("printLogo");

  if (state.companyLogo) {
    printLogo.src = state.companyLogo;
    printLogo.style.display = "block";
  } else {
    printLogo.src = "";
    printLogo.style.display = "none";
  }
}

function addStaff() {
  const name = document.getElementById("staffName").value.trim();
  const section = document.getElementById("staffSection").value;

  if (!name) {
    alert("Please enter a staff name.");
    return;
  }

  saveHistory();

  state.staff.push({
    id: Date.now(),
    name: name,
    section: section
  });

  document.getElementById("staffName").value = "";
  saveData();
  renderStaffLists();
  render();
}

function removeStaff(id) {
  saveHistory();

  state.staff = state.staff.filter(function(staffMember) {
    return staffMember.id !== id;
  });

  saveData();
  renderStaffLists();
  render();
}

function renderStaffLists() {
  const dayList = document.getElementById("dayStaffList");
  const nightList = document.getElementById("nightStaffList");

  dayList.innerHTML = "";
  nightList.innerHTML = "";

  state.staff.forEach(function(person) {
    const chip = document.createElement("div");
    chip.className = "staff-chip";

    const nameSpan = document.createElement("span");
    nameSpan.textContent = person.name;

    const removeButton = document.createElement("button");
    removeButton.textContent = "X";
    removeButton.onclick = function() {
      removeStaff(person.id);
    };

    chip.appendChild(nameSpan);
    chip.appendChild(removeButton);

    if (person.section === "DAY") {
      dayList.appendChild(chip);
    } else {
      nightList.appendChild(chip);
    }
  });
}

function setSection(section) {
  state.section = section;

  document.getElementById("dayTab").classList.toggle("active", section === "DAY");
  document.getElementById("nightTab").classList.toggle("active", section === "NIGHT");

  render();
}

function daysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}

function getEaster(year) {
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;

  return new Date(year, month - 1, day);
}

function isPublicHoliday(date) {
  const year = date.getFullYear();
  const month = date.getMonth();
  const day = date.getDate();

  const key = String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");

  if (FIXED_HOLIDAYS.includes(key)) {
    return true;
  }

  const easter = getEaster(year);

  const goodFriday = new Date(easter);
  goodFriday.setDate(easter.getDate() - 2);

  const familyDay = new Date(easter);
  familyDay.setDate(easter.getDate() + 1);

  if (date.getTime() === goodFriday.getTime() || date.getTime() === familyDay.getTime()) {
    return true;
  }

  if (date.getDay() === 0) {
    const nextDay = new Date(date);
    nextDay.setDate(date.getDate() + 1);

    const nextKey = String(nextDay.getMonth() + 1).padStart(2, "0") + "-" + String(nextDay.getDate()).padStart(2, "0");

    if (FIXED_HOLIDAYS.includes(nextKey)) {
      return true;
    }
  }

  return false;
}

function isSpecialDay(date) {
  const day = date.getDay();
  return day === 0 || day === 6 || isPublicHoliday(date);
}

function toggleOD(staffId, dateKey) {
  saveHistory();

  const key = staffId + "|" + dateKey;

  if (state.roster[key] === "OD") {
    delete state.roster[key];
  } else {
    state.roster[key] = "OD";
  }

  saveData();
  render();
}

function clearMonth() {
  if (!confirm("Clear all OD marks for this month?")) {
    return;
  }

  saveHistory();

  const year = parseInt(yearSelect.value);
  const month = parseInt(monthSelect.value);
  const total = daysInMonth(year, month);

  for (let day = 1; day <= total; day++) {
    const dateKey = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");

    state.staff
      .filter(function(staffMember) {
        return staffMember.section === state.section;
      })
      .forEach(function(staffMember) {
        delete state.roster[staffMember.id + "|" + dateKey];
      });
  }

  saveData();
  render();
}

function updateGoogleStatus() {
  const status = document.getElementById("googleStatus");

  if (!cloudSettings.spreadsheetId) {
    status.textContent = "Not connected";
    status.className = "google-status";
    return;
  }

  if (googleAccessToken) {
    status.textContent = "Connected and syncing";
    status.className = "google-status connected";
  } else {
    status.textContent = "Sheet selected. Connect Google to sync.";
    status.className = "google-status";
  }
}

function saveSpreadsheetId() {
  cloudSettings.spreadsheetId = document.getElementById("spreadsheetId").value.trim();

  saveCloudSettings();
  updateGoogleStatus();
}

function connectGoogle() {
  if (typeof google === "undefined") {
    alert("Google sign-in is still loading. Please try again.");
    return;
  }

  const client = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: "https://www.googleapis.com/auth/spreadsheets",
    callback: function(response) {
      googleAccessToken = response.access_token;
      googleTokenExpiry = Date.now() + (response.expires_in * 1000);

      updateGoogleStatus();
      syncNow();
    }
  });

  client.requestAccessToken();
}

function disconnectGoogle() {
  googleAccessToken = "";
  googleTokenExpiry = 0;

  updateGoogleStatus();
}

function isGoogleConnected() {
  return googleAccessToken && Date.now() < googleTokenExpiry && cloudSettings.spreadsheetId;
}

async function createGoogleSheet() {
  if (!googleAccessToken) {
    alert("Connect your Google account first.");
    return;
  }

  try {
    const response = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + googleAccessToken,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        properties: {
          title: "Staff Duty Roster"
        },
        sheets: [
          {
            properties: {
              title: "Roster Data"
            }
          }
        ]
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error.message);
    }

    cloudSettings.spreadsheetId = result.spreadsheetId;

    document.getElementById("spreadsheetId").value = result.spreadsheetId;

    saveCloudSettings();
    updateGoogleStatus();

    await syncNow();

    alert("Google Sheet created and connected.");
  } catch (error) {
    alert("Could not create Google Sheet: " + error.message);
  }
}

function getRosterDataForSheets() {
  return {
    companyName: state.companyName,
    preparedByName: state.preparedByName,
    staff: state.staff,
    roster: state.roster,
    section: state.section
  };
}

async function syncNow() {
  if (!isGoogleConnected()) {
    updateGoogleStatus();
    return;
  }

  const spreadsheetId = cloudSettings.spreadsheetId;
  const data = getRosterDataForSheets();

  try {
    const response = await fetch(
      "https://sheets.googleapis.com/v4/spreadsheets/" + spreadsheetId + "/values/Roster Data!A1:1?valueInputOption=RAW",
      {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + googleAccessToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          values: [
            [JSON.stringify(data)]
          ]
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error.message);
    }

    updateGoogleStatus();
  } catch (error) {
    const status = document.getElementById("googleStatus");
    status.textContent = "Sync failed: " + error.message;
    status.className = "google-status error";
  }
}

async function loadFromGoogleSheets() {
  if (!cloudSettings.spreadsheetId) {
    return;
  }

  if (!googleAccessToken) {
    return;
  }

  const spreadsheetId = cloudSettings.spreadsheetId;

  try {
    const response = await fetch(
      "https://sheets.googleapis.com/v4/spreadsheets/" + spreadsheetId + "/values/Roster Data!A1",
      {
        headers: {
          "Authorization": "Bearer " + googleAccessToken
        }
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error.message);
    }

    const values = result.values;

    if (!values || !values[0] || !values[0][0]) {
      return;
    }

    const cloudData = JSON.parse(values[0][0]);

    state.companyName = cloudData.companyName || state.companyName;
    state.preparedByName = cloudData.preparedByName || state.preparedByName;
    state.staff = cloudData.staff || state.staff;
    state.roster = cloudData.roster || state.roster;
    state.section = cloudData.section || state.section;

    saveData();
    updateCompanyHeader();
    renderStaffLists();
    render();
  } catch (error) {
    console.log("Could not load from Google Sheets:", error);
  }
}

async function exportPDF() {
  const element = document.querySelector(".roster-wrap");

  if (!element) {
    alert("Roster not found.");
    return;
  }

  if (typeof html2canvas === "undefined" || typeof jspdf === "undefined") {
    alert("PDF export needs an internet connection. Please connect to Wi-Fi or mobile data and try again.");
    return;
  }

  try {
    const canvas = await html2canvas(element, {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff"
    });

    const imgData = canvas.toDataURL("image/png");

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: "landscape",
      unit: "mm",
      format: "a4"
    });

    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();

    const imgWidth = pageWidth - 10;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    let heightLeft = imgHeight;
    let position = 5;

    pdf.addImage(imgData, "PNG", 5, position, imgWidth, imgHeight);
    heightLeft -= (pageHeight - 10);

    while (heightLeft > 0) {
      position = heightLeft - imgHeight + 5;
      pdf.addPage();
      pdf.addImage(imgData, "PNG", 5, position, imgWidth, imgHeight);
      heightLeft -= (pageHeight - 10);
    }

    const companyName = state.companyName || "Staff-Duty-Roster";
    const safeCompanyName = companyName
      .replace(/[^a-z0-9]/gi, "-")
      .replace(/-+/g, "-");

    const fileName = safeCompanyName + "-" + state.section + "-" + MONTHS[monthSelect.value] + "-" + yearSelect.value + ".pdf";

    pdf.save(fileName);
  } catch (error) {
    alert("Could not create PDF: " + error.message);
  }
}

function render() {
  const year = parseInt(yearSelect.value);
  const month = parseInt(monthSelect.value);
  const total = daysInMonth(year, month);

  const staff = state.staff.filter(function(staffMember) {
    return staffMember.section === state.section;
  });

  updatePrintHeader();

  let html = "<table>";

  html += '<tr class="date-row">';
  html += '<th class="staff-name">Staff</th>';

  for (let day = 1; day <= total; day++) {
    html += "<th>" + day + "</th>";
  }

  html += "</tr>";

  html += '<tr class="weekday-row">';
  html += '<th class="staff-name">Day</th>';

  for (let day = 1; day <= total; day++) {
    const date = new Date(year, month, day);
    const dayName = ["S", "M", "T", "W", "T", "F", "S"][date.getDay()];
    const special = isSpecialDay(date);

    html += '<th class="' + (special ? "special-cell weekend-letter" : "weekday-cell") + '">' + dayName + "</th>";
  }

  html += "</tr>";

  if (staff.length === 0) {
    html += '<tr><td class="empty" colspan="' + (total + 1) + '">No staff added for ' + state.section.toLowerCase() + " shift.</td></tr>";
  }

  staff.forEach(function(person) {
    html += '<tr><td class="staff-name">' + person.name + "</td>";

    for (let day = 1; day <= total; day++) {
      const date = new Date(year, month, day);

      const dateKey = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");

      const status = state.roster[person.id + "|" + dateKey] === "OD" ? "OD" : "OFF";

      const special = isSpecialDay(date);

      html += '<td class="' + (status === "OD" ? "od" : "of") + " " + (special ? "special-cell" : "") + '" onclick="toggleOD(' + person.id + ", '" + dateKey + '\')">' + status + "</td>";
    }

    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("roster").innerHTML = html;
}

monthSelect.addEventListener("change", function() {
  render();
});

yearSelect.addEventListener("change", function() {
  render();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker
    .register("./service-worker.js")
    .then(function() {
      console.log("Service worker registered.");
    })
    .catch(function(error) {
      console.log("Service worker registration failed:", error);
    });
}

loadData();
updateCompanyHeader();
showLogoPreview();
renderStaffLists();
render();

async function connectGoogleSilently() {
  if (typeof google === "undefined") {
    return;
  }

  const client = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: "https://www.googleapis.com/auth/spreadsheets",
    callback: function(response) {
      googleAccessToken = response.access_token;
      googleTokenExpiry = Date.now() + (response.expires_in * 1000);

      updateGoogleStatus();
      loadFromGoogleSheets();
    }
  });

  client.requestAccessToken();
}

if (cloudSettings.spreadsheetId) {
  connectGoogleSilently();
}
